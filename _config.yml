# Site
# ========================================================================================
url: https://learningnrunning.github.io
baseurl: ""
timezone: Asia/Seoul
lang: ko-KR
locale: ko_KR

title: 김성록 · LearningnRunning
name: LearningnRunning
description: 정제되지 않은 데이터를 LLM · 에이전트 · 추천이 쓸 수 있게 만드는 ML/AI 엔지니어 김성록의 포트폴리오와 기술 블로그
tagline: 정제되지 않은 데이터를 LLM과 추천이 쓸 수 있게 만드는 ML/AI 엔지니어
keywords: [데이터 파이프라인, 데이터 정제, LLM, AI 에이전트, RAG, MCP, 추천 시스템, 취향 데이터, 개인화, 랭킹, 머신러닝, 광고 검수]
logo: /assets/img/logo.png
author: LearningnRunning

# 기존 글 URL(/post/<category>/<date>-<title>/)을 그대로 유지하기 위한 설정 — 바꾸지 말 것
permalink: /:categories/:year-:month-:day-:title/

# Collections
# ========================================================================================
collections:
  projects:
    output: true
    permalink: /projects/:path/
  featured_categories:
    output: true
    permalink: /:name/

defaults:
  - scope: { type: posts }
    values: { layout: post, author: LearningnRunning }
  - scope: { type: projects }
    values: { layout: project, seo: { type: WebPage } }
  - scope: { type: featured_categories }
    values: { layout: list, seo: { type: WebPage } }
  - scope: { path: assets/ }
    values: { sitemap: false }

# Markdown
# ========================================================================================
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  footnote_backlink: '&#x21a9;&#xfe0e;'
  syntax_highlighter: rouge

# Build
# ========================================================================================
exclude:
  - .jekyll-cache
  - .sass-cache
  - .DS_Store
  - "*.toml"
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - LICENSE.md
  - NOTICE.md
  - licenses/
  - docs/
  - _site
  - _sass
  - scripts/
  - node_modules
  - package.json
  - package-lock.json
  - about copy.md
  - "="
include:
  - .well-known

plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

optional_front_matter:
  remove_originals: true
relative_links:
  collections: true

# SEO
# ========================================================================================
twitter:
  username: learningnrunning
  card: summary_large_image
social:
  name: Seongrok Kim
  links:
    - https://github.com/LearningnRunning
    - https://www.linkedin.com/in/learningnrunning/
google_site_verification: google0d64cda6606e6a65
naver_site_verification: naver7b076e7e739b7e134d1626e798cc4da4

jekyll_compose:
  default_front_matter:
    posts:
      layout: post
      categories: [engineering]
      description: >
        검색·공유 미리보기에 쓰이는 160자 내외 요약

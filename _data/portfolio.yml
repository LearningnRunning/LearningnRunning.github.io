# 데이터 우선 — 비정제 데이터 → 정제 → LLM · 에이전트 · 추천 (홈 #data 섹션)
pipelines:
  - project: ad-compliance-jp
    key: production
    where: 실무
    raw: 일본어 광고 문구, 법령 · 가이드라인 · 위반/정상 사례
    refined: held-out 1,222건으로 평가 기준을 먼저 고정하고, 코퍼스를 성격별로 분리 색인해 semantic + BM25 하이브리드 검색
    consumer: LLM
    use: 위반 판정에 근거와 대체 문구를 붙이고, 라벨러 재검토 결과가 다시 학습 데이터로
  - project: influencer-platform
    key: platform
    where: 실무
    raw: 크리에이터가 올린 형식 제각각의 인사이트 스크린샷
    refined: 영역 크롭 + OCR로 성과 지표 7개를 추출해 제출값과 자동 대조
    consumer: 운영
    use: 마케터가 스크린샷을 한 장씩 옮겨 적던 일을 불일치 건 확인으로
  - project: youtube-placement
    key: platform
    where: 실무
    raw: YouTube 영상 제목 · 설명 · 메타데이터
    refined: 최하위 상품 카테고리 약 3,000개로 영상 Pool 15만 수집, 카테고리 · 브랜드 매핑과 경쟁사 탐지
    consumer: 추천
    use: 상품에 맞는 채널 · 영상을 근거와 함께 광고 지면으로 추천
  - project: trade-bridge
    key: llm
    where: 개인
    raw: 시세 · 재무 · 거시지표 · SEC 공시 등 6종 외부 소스
    refined: LLM이 바로 조회 · 조합할 수 있는 57개 tool 스키마로 정리
    consumer: 에이전트
    use: 거시 → 섹터 → 종목 Top-down 리서치를 에이전트가 직접 수행
  - project: locals-only
    key: food
    where: 개인
    raw: 가게마다 제각각 적힌 메뉴 187만 행
    refined: 규칙 + 로컬 LLM으로 대표메뉴 320개에 매핑 (51.6% → 73.6%), 큐레이션 어드민으로 사람이 교정
    consumer: 추천
    use: 위치마다 '이 동네에서 잘하는 음식' 타일 → 로컬 가게
  - project: jjeopjjeop-lab
    key: food
    where: 연구 모임
    raw: 리뷰 2,110만 mention
    refined: 문장 임베딩 → UMAP + HDBSCAN으로 의미 단위(semantic_id) 군집, 노이즈 96% → 48%
    consumer: 추천
    use: 유저→식당 · 유사 식당 · 유사 유저 추천 3종
  - project: hint
    key: people
    where: 개인
    raw: 카카오톡 대화 · 설문 응답
    refined: 결 타입 4축 · 생활 속성 · 선(boundary) 3개 층으로 분리
    consumer: 매칭
    use: 대화가 통할 사람부터 연결 (Phase 1 개발 중)

# 다음 방향 — 취향 데이터 → 추천 : 세 도메인 (홈 #next 섹션)
domains:
  - key: food
    label: 음식점 추천
    signal: 리뷰 문장, 평점 편차, 방문 이력
    built: >-
      리뷰 문장을 의미 단위(semantic_id)로 묶어 유저→식당 · 유사 식당 · 유사 유저 추천 3종을 구현하고,
      리뷰어의 '평소 대비' 평점 편차와 Bayesian 랭킹 위에, 메뉴에서 시작해 로컬 가게로 좁혀 가는 서비스(Locals Only)를 운영 중입니다.
    projects: [jjeopjjeop-lab, locals-only]
  - key: travel
    label: 여행지 · 로컬 발견
    signal: 권역별 로컬 리뷰, 낯선 장소에서의 탐색 맥락
    built: >-
      서울·수도권뿐 아니라 동해권(고성·속초·양양·강릉)·제주·가평, 오사카·도쿄까지 권역별로 데이터를 모았습니다.
      '토박이 모드'와 '여행자 모드'를 나눠 설계하고, 한국어·영어·일본어로 서비스해 외국인 여행자도 로컬 맛집을 메뉴부터 찾을 수 있게 했습니다.
    projects: [locals-only, jjeopjjeop-lab]
  - key: people
    label: 사람 추천 · 매칭
    signal: 대화 맥락, 설문 응답, 생활 속성과 '선(boundary)'
    built: >-
      카카오톡 대화와 설문에서 관계 성향을 읽어 '결 타입'으로 매칭하는 플랫폼을 설계 중입니다.
      측정(설문 문항 형식·묵종 편향)부터 매칭 단위, 안전장치까지 단계적으로 쌓고 있습니다.
    projects: [hint]

# 일하는 방식 — 방향을 받아 끝까지 가져가는 루프
process:
  - step: "01"
    title: 방향을 문제로 바꾼다
    body: >-
      대표가 '관상 서비스'를 원했을 때, 먼저 가능 범위를 조사한 뒤 같은 기술(FaceMesh)로 더 빨리 가치를 낼 수 있는
      '얼굴 비율 기반 메이크업 추천'을 대안으로 제안해 진행했습니다.
    ref: { label: 귀신 피하려다가 호랑이 만나다, url: /post/engineering/2023-08-05-.Startup-service-development-period-copy/ }
  - step: "02"
    title: 리서치로 구조를 추정한다
    body: >-
      "하루빨리 AI 프로필 같은 걸" 이라는 요청에 경쟁 서비스(SNOW·Meitu·Carat)를 뜯어보고
      '생성이 아니라 얼굴 교체'라는 구현 가설을 세워 80일 만에 AI Snap을 출시했습니다.
    ref: { label: 80일 안에 AI 서비스 배포하기, url: /post/engineering/2023-12-20-Deploying-AI-services-in-80-days/ }
  - step: "03"
    title: 필요한 지식은 가진 사람에게 받아온다
    body: >-
      메이크업 전문가, 간호교육학 박사과정 연구자, 현업 주식 트레이더, CTO 기술고문, 라벨러까지 —
      도메인 판단이 필요한 지점마다 직접 찾아가 요구사항을 받아 아키텍처 원칙으로 번역했습니다.
  - step: "04"
    title: 단계를 나눠 PoC부터 쌓는다
    body: >-
      실측 분포(리뷰어 63%가 리뷰 1건)를 근거로 '학습 없는 근사검색 → 생성형 시퀀스 추천 → 랭킹 결합'의 Phase A/B/C를 나누고,
      광고 검수는 ML 단독부터 LLM 위임까지 4개 운영 모드로 쪼개 위험을 통제했습니다.
  - step: "05"
    title: 검증되지 않은 건 검증되지 않았다고 쓴다
    body: >-
      held-out 벤치마크, 실트래픽 Shadow 비교, 시점 컷오프로 리키지 차단. dry-run에서 체이닝 현상을 발견하면 전체 반영을 보류합니다.
      모든 프로젝트 페이지에 '한계와 다음 단계'를 함께 적었습니다.
  - step: "06"
    title: 사람의 판단이 다시 데이터로 돌아오게 만든다
    body: >-
      광고 검수의 '최종검토 에이전트 → 라벨러 재검토 → 재학습 → 재배포' 루프, Locals Only의 큐레이션 어드민처럼
      모델이 틀린 곳을 사람이 고치고, 그 수정이 재발행에도 지켜지는 구조로 마무리합니다.


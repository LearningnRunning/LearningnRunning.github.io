hero:
  eyebrow: ML/AI Engineer · Data → LLM · Agent · Recommendation
  title_lines:
    - 정제되지 않은 데이터를
    - LLM과 추천이 쓸 수 있게 만듭니다
  lead: >-
    광고 문구, 인사이트 스크린샷, 영상 메타데이터, 리뷰 한 문장처럼 그대로는 쓸 수 없는 데이터를
    정제 파이프라인으로 구조화하고, 그 위에 LLM 판단 · 에이전트 도구 · 추천을 올려 실서비스로 운영해 온
    4년차 ML/AI 엔지니어 김성록입니다. 다음은 이 방식을 취향 데이터 기반 추천으로 가져가려 합니다.
  # 히어로 다이어그램: 원천 → 정제 → 활용 (행 단위로 정렬)
  flow:
    - key: production
      raw: 일본어 광고 문구 · 법령 · 위반/정상 사례
      refined: 성격별 분리 색인 · 하이브리드 RAG
      use: LLM 위반 판정 + 근거 · 대체 문구
    - key: platform
      raw: 인플루언서 인사이트 스크린샷
      refined: 크롭 + OCR → 성과 지표 7개
      use: 제출값 자동 대조, 불일치만 사람이
    - key: platform
      raw: YouTube 제목 · 설명 · 메타데이터
      refined: 상품 카테고리 · 브랜드 매핑
      use: 상품에 맞는 광고 지면 추천
    - key: food
      raw: 리뷰 2,110만 mention · 메뉴 187만 행
      refined: semantic_id · 대표메뉴 320개
      use: 유저→식당 · 음식 먼저 발견
  stats:

<header class="site-header">
  <div class="wrap header-in">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="홈">
      <span class="brand-mark" aria-hidden="true">SK</span>
      <span class="brand-name">김성록</span>
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      {%- assign is_home = false -%}{%- if page.url == '/' -%}{%- assign is_home = true -%}{%- endif -%}
      <a href="{{ '/#projects' | relative_url }}">프로젝트</a>
      <a href="{{ '/#how' | relative_url }}">일하는 방식</a>
      <a href="{{ '/#career' | relative_url }}">경력</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.layout == 'post' or page.layout == 'blog' or page.layout == 'list' %} aria-current="page"{% endif %}>블로그</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드 전환" data-theme-toggle>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </nav>
  </div>
</header>

{%- assign p = include.project -%}
<a class="prow{% if include.large %} is-lead{% endif %}" href="{{ p.url | relative_url }}">
  <div>
    <div class="prow-top">
      <div class="dtags">{% for d in p.domains %}<span class="dtag">{{ site.data.domains[d].short }}</span>{% endfor %}</div>
      <span class="prow-period">{{ p.period }}</span>
    </div>
    <h3>{{ p.title }}</h3>
    <p class="prow-sub">{{ p.subtitle }}</p>
  </div>
  {% if p.metrics %}
  <dl class="prow-figs">
    {% for m in p.metrics limit: 3 %}<div><dt>{{ m.label }}</dt><dd>{% include figure.html value=m.value %}</dd></div>{% endfor %}
  </dl>
  {% endif %}
</a>
